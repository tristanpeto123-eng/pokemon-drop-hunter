name: Free Pokemon Stock Watch
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokemon-drop-free-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore monitor history
        shell: bash
        run: |
          if git fetch origin monitor-state:refs/remotes/origin/monitor-state 2>/dev/null; then
            git show origin/monitor-state:state.json > state.json || echo '{}' > state.json
          else
            echo '{}' > state.json
          fi
      - name: Scan retailer product listings
        shell: bash
        env:
          RUN_ONCE: "true"
          SECOND_CONFIRMATION_SECONDS: "12"
          EMAIL_TO: ${{ secrets.POKEMON_EMAIL_TO }}
          EMAIL_LIVE: ${{ vars.POKEMON_ENABLE_EMAIL }}
          BREVO_API_KEY: ${{ secrets.POKEMON_BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.POKEMON_BREVO_SENDER }}
        run: |
          if [[ "$EMAIL_LIVE" == "true" && -n "$EMAIL_TO" && -n "$SMTP_USER" && -n "$SMTP_PASSWORD" ]]; then
            export EMAIL_ENABLED=true
          else
            export EMAIL_ENABLED=false
            echo "::notice::Dry-run until secret credentials are configured AND POKEMON_ENABLE_EMAIL=true."
          fi
          python monitor.py
      - name: Save state to dedicated branch
        if: success()
        shell: bash
        run: |
          test -f state.json || printf '{}\n' > state.json
          cp state.json "$RUNNER_TEMP/pokemon-state.json"
          rm state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git fetch origin monitor-state
            git checkout -B monitor-state FETCH_HEAD
          else
            git checkout -b monitor-state
          fi
          cp "$RUNNER_TEMP/pokemon-state.json" state.json
          git add -f state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh stock state [skip ci]"
            git push -u origin monitor-state
          else
            echo "No observation changes."
          fi
